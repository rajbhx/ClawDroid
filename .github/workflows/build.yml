name: Build ClawDroid

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}

      - name: Validate bootstrap version
        run: |
          EXPECTED=$(grep TERMUX_BOOTSTRAP_VERSION android/gradle.properties | cut -d= -f2)
          echo "Bootstrap version: $EXPECTED"
          curl -sI "https://github.com/termux/termux-packages/releases/download/bootstrap-${EXPECTED}+apt.android-7/bootstrap-aarch64.zip" | head -1

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: cd android && ./gradlew testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: clawdroid-debug
          path: android/app/build/outputs/apk/debug/*.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -PkeystoreFile=/tmp/release.jks \
            -PkeystorePassword=${{ secrets.KEYSTORE_PASSWORD }} \
            -PkeyAlias=${{ secrets.KEY_ALIAS }} \
            -PkeyPassword=${{ secrets.KEY_PASSWORD }}

      - uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
